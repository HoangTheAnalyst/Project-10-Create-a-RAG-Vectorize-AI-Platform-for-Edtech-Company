version: 2

models:
  - name: fct_log
    description: "Fact table recording all AI assistant query logs, performance metrics, and retrieval evaluations."
    columns:
      - name: query_sk
        description: "Surrogate key generated from query_id (Primary Key)."
        tests:
          - not_null
          - unique

      - name: hashed_client_ip
        description: "Hashed client IP address for user tracking and privacy compliance."
        tests:
          - not_null

      - name: lesson_sk
        description: "Foreign surrogate key linking to dim_lesson."
        tests:
          - not_null

      - name: selected_subject
        description: "Subject selected by the user in the interface."
        tests:
          - not_null

      - name: selected_lesson
        description: "Lesson selected by the user in the interface."
        tests:
          - not_null

      - name: similarity_threshold
        description: "Minimum similarity threshold configured for vector retrieval."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0 and similarity_threshold <= 1"

      - name: chunks_retrieved
        description: "Total number of context chunks retrieved from vector search."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: top_similarity_score
        description: "Highest cosine similarity score among the retrieved chunks."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0 and top_similarity_score <= 1"

      - name: latency_seconds
        description: "End-to-end processing time for query in seconds."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: user_query_length
        description: "Character count of the user's prompt."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: ai_response_length
        description: "Character count of the response generated by AI."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: similarity_score_diff
        description: "Margin between the highest similarity score and the threshold (top_score - threshold)."
        tests:
          - not_null

      - name: no_chunks_retrieved
        description: "Boolean flag indicating whether zero chunks met the retrieval threshold."
        tests:
          - not_null

      - name: high_latency
        description: "Boolean flag indicating if total latency exceeded 5 seconds SLA."
        tests:
          - not_null

      - name: created_at
        description: "Timestamp when the query was logged."
        tests:
          - not_null
  - name: fct_answer
    description: "Fact table containing answer-related metrics."
    columns:
      - name: query_sk
        description: "Surrogate key linking to fct_log."
        tests:
          - not_null
          - unique
      - name: user_query
        description: "The original query submitted by the user."
        tests:
          - not_null
      - name: ai_response
        description: "The response generated by the AI model."
        tests:
          - not_null
      - name: selected_subject
        description: "The subject selected by the user for the query."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Tất cả', 'History', 'Literature', 'Geography']
      - name: selected_lesson
        description: "The lesson selected by the user for the query."
        tests:
          - not_null
      - name: created_at
        description: "Timestamp when the answer was logged."
        tests:
          - not_null
sources:
  - name: raw_log_source
    database: RAG_AI_PLATFORM
    schema: RAW
    tables:
      - name: query_logs
        description: "Raw ingested logs from local JSON batch pipeline."
        columns:
          - name: query_id
            description: "Primary identifier for query logs"
            tests:
              - not_null
              - unique
          - name: client_ip
            description: "IP address of the client making the query"
            tests:
              - not_null
          - name: user_query
            description: "The query string submitted by the user"
            tests:
              - not_null
          - name: selected_subject
            description: "The subject selected by the user for the query"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['Tất cả', 'History', 'Literature', 'Geography']
          - name: selected_lesson
            description: "The lesson selected by the user for the query"
            tests:
              - not_null
          - name: similarity_threshold
            description: "The similarity threshold set for the query"
            tests:
              - not_null
          - name: chunks_retrieved
            description: "Number of chunks retrieved for the query"
            tests:
              - not_null
          - name: top_similarity_score
            description: "The highest similarity score among the retrieved chunks"
            tests:
              - not_null
              - dbt_utils.expression_is_true:
                  expression: ">= similarity_threshold and top_similarity_score <= 1"
          - name: ai_response
            description: "The response generated by the AI for the query"
            tests:
              - not_null
          - name: latency_seconds
            description: "Time taken to process the query in seconds"
            tests:
              - not_null
          
          - name: created_at
            description: "Timestamp when the query log was created"
            tests:
              - not_null